# GitHub Release を作る。起動方法は2通り：
#   1. Actions タブから手動実行（workflow_dispatch）… VERSION の番号で vX.Y.Z タグと Release を作る
#   2. vX.Y.Z タグを push … そのタグで Release を作る（タグと VERSION が一致している必要がある）
# 本文は CHANGELOG.md の該当バージョンの節。
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョンとタグを決める
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と VERSION ($VER) が一致しません"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=v$VER" >> "$GITHUB_ENV"

      - name: CHANGELOG.md から該当バージョンの節を取り出す
        run: |
          awk -v ver="$VER" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md に [$VER] の節がありません"
            exit 1
          fi
          cat release-notes.md

      - name: GitHub Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG はすでにあります。VERSION と CHANGELOG.md を新しい番号にしてください"
            exit 1
          fi
          # タグがまだなければ、このコミットに作られる
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
